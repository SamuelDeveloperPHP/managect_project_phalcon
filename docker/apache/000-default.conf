ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Sem "Indexes": não listar o conteúdo de diretórios sem index.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cabeçalhos de segurança (mod_headers já habilitado no Dockerfile).
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # HSTS só tem efeito sob HTTPS; navegadores ignoram quando recebido via HTTP (dev).
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        # 'unsafe-inline' cobre scripts/estilos inline nas views.
        # 'unsafe-eval' é exigido pelo build completo do Vue (/users compila templates no cliente).
        #   -> para remover: migrar a página de usuários para Vue runtime-only ou templates pré-compilados.
        # Libs de frontend servidas localmente (/assets/vendor) — sem CDNs externos.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/phalcon-error.log
    CustomLog ${APACHE_LOG_DIR}/phalcon-access.log combined
</VirtualHost>
