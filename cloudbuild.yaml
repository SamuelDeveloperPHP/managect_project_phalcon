# Compila a imagem no Cloud Build (servidores do Google) e publica no
# Artifact Registry. Nao usa CPU/RAM da VM.
#
# Rodar (a partir de uma copia do repositorio, ex: no Cloud Shell):
#   gcloud builds submit --config cloudbuild.yaml .
#
# $PROJECT_ID e preenchido automaticamente pelo Cloud Build.

substitutions:
  _REGION: southamerica-east1
  _REPO: phalcon
  _IMAGE: app
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA

timeout: 1800s

# Compilar mais rapido (custa um pouco mais que o builder padrao):
# descomente as 2 linhas abaixo.
# options:
#   machineType: E2_HIGHCPU_8
