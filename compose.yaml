services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phalcon_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      # Config do Apache (headers/CSP) por bind mount: editar + restart aplica,
      # sem rebuild da imagem.
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-phalcon}
      DB_USERNAME: ${DB_USERNAME:-phalcon}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@phalcon.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      MASTER_NAME: ${MASTER_NAME:-Administrador Master}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - phalcon_network

  mysql:
    image: mysql:5.7
    container_name: phalcon_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_DATABASE:-phalcon}
      MYSQL_USER: ${DB_USERNAME:-phalcon}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - phalcon_network

  redis:
    image: redis:7-alpine
    container_name: phalcon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - phalcon_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phalcon_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-phalcon}
      PMA_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - phalcon_network

volumes:
  mysql_data:
  redis_data:

networks:
  phalcon_network:
    driver: bridge
